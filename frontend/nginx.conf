server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression gzip pour les assets statiques
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 256;

    # Cache long pour les assets Vite (hash dans le nom de fichier)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # SPA fallback : toutes les routes non trouvées renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API Gateway (évite les problèmes CORS depuis le navigateur)
    location /api/ {
        proxy_pass         http://api-gateway:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
