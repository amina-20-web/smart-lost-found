# Test configuration: uses local MySQL matching_db
spring.application.name=matching-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/matching_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# In unit and persistence tests, disable listener auto-start so tests pass even if cloud broker rejects credentials
spring.rabbitmq.addresses=${CLOUDAMQP_URL:}
matching.consumer.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

matching.threshold=70.0
matching.weights.category=30.0
matching.weights.color=20.0
matching.weights.location=25.0
matching.weights.event-date=15.0
matching.weights.description=10.0
