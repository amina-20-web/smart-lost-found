# ══════════════════════════════════════════════════════════════
#  application-docker.properties — notification-service
#
#  Profil actif quand SPRING_PROFILES_ACTIVE=docker (Docker Compose).
#  Les valeurs MySQL et RabbitMQ sont injectées par des variables
#  d'environnement définies dans docker-compose.yml.
# ══════════════════════════════════════════════════════════════

# MySQL (variable d'env SPRING_DATASOURCE_URL injectée par Docker Compose)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logs moins verbeux en mode Docker
logging.level.root=WARN
logging.level.com.smartlostfound=INFO
logging.level.org.springframework.amqp=WARN
