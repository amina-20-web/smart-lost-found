# 1. Nom du microservice
spring.application.name=notification-service

# 2. Port indépendant pour éviter les conflits avec les autres services (8080, 8081, 8082)
server.port=8083

# 3. Configuration de la connexion à MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_lost_found_notifications?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Configuration JPA / Hibernate (création automatique des tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. Configuration RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest